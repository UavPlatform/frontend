name: OpenAPI Contract Sync

on:
  repository_dispatch:
    types: [openapi-updated]
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch contract from backend Release
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          DISPATCH_SHA256: ${{ github.event.client_payload.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/contract

          # 资产下载统一走 GitHub API（gh release download）：匿名
          # releases/download/... 会 302 到 release-assets CDN，实测长期 504（见 PR 说明）。
          TAG="$DISPATCH_TAG"
          EXPECTED_SHA256="$DISPATCH_SHA256"

          if [ -n "$TAG" ]; then
            echo "来源：repository_dispatch event"
          else
            echo "来源：schedule/workflow_dispatch，查询最新 contract-* Release"
            TAG=$(gh release list --repo UavPlatform/backend --limit 100 \
              --json tagName --jq '[.[] | .tagName | select(startswith("contract-"))] | first // ""')
          fi

          if [ -z "$TAG" ]; then
            echo "未找到 contract-* Release，回退到 raw URL"
            ASSET_URL="https://raw.githubusercontent.com/UavPlatform/backend/main/spec/openapi/drone-backend.openapi.json"
            TAG="raw-fallback"
            curl -fsSL --retry 3 "$ASSET_URL" -o /tmp/contract/drone-backend.openapi.json
            EXPECTED_SHA256=""
          else
            echo "下载 Release 资产：$TAG"
            gh release download "$TAG" \
              --repo UavPlatform/backend \
              --pattern 'drone-backend.openapi.json' \
              --pattern '*.sha256' \
              --dir /tmp/contract \
              --clobber
            ASSET_URL="https://github.com/UavPlatform/backend/releases/download/$TAG/drone-backend.openapi.json"
            if [ -z "$EXPECTED_SHA256" ]; then
              EXPECTED_SHA256=$(awk '{print $1}' /tmp/contract/drone-backend.openapi.json.sha256)
            fi
          fi

          echo "TAG=$TAG"
          echo "ASSET_URL=$ASSET_URL"
          echo "EXPECTED_SHA256=$EXPECTED_SHA256"

          ACTUAL_SHA256=$(sha256sum /tmp/contract/drone-backend.openapi.json | awk '{print $1}')
          echo "ACTUAL_SHA256=$ACTUAL_SHA256"

          # sha256 校验失败是真失败：下载到的不是被发布的那份契约，后续生成没有意义。
          if [ -n "$EXPECTED_SHA256" ] && [ "$EXPECTED_SHA256" != "$ACTUAL_SHA256" ]; then
            echo "::error::SHA256 校验失败（预期 $EXPECTED_SHA256，实际 $ACTUAL_SHA256）"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha256=$ACTUAL_SHA256" >> "$GITHUB_OUTPUT"
          echo "asset_url=$ASSET_URL" >> "$GITHUB_OUTPUT"

      - name: Sync contract and generate types
        env:
          OPENAPI_SOURCE: /tmp/contract/drone-backend.openapi.json
        run: |
          pnpm run api:sync
          pnpm run api:gen
          pnpm run api:check

      # 消费侧校验（typecheck）不阻断 PR：同步 PR 是「工单」，职责是把新契约带进仓库并
      # 暴露需要适配的调用点。硬门禁在 main 的 CI（.github/workflows/ci.yml）里。
      - name: Run type check (non-blocking)
        id: typecheck
        continue-on-error: true
        run: |
          set +e
          pnpm run typecheck 2>&1 | tee /tmp/typecheck.log
          STATUS=${PIPESTATUS[0]}
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            echo "::warning::typecheck 未通过（不阻断 PR），详见 PR 正文的待办清单"
          fi
          exit 0

      - name: Collect adapter worklist
        id: worklist
        run: |
          set -uo pipefail
          {
            echo 'worklist<<EOF'
            if [ "${{ steps.typecheck.outputs.status }}" = "0" ]; then
              echo '无明显待适配项（typecheck 通过）。'
            else
              echo '以下 `pnpm run typecheck` 报错需要在本 PR 内适配（新增/改动的接口实现）：'
              echo ''
              echo '```'
              grep -E 'error TS' /tmp/typecheck.log | head -60 > /tmp/typecheck-errors.txt || true
              if [ -s /tmp/typecheck-errors.txt ]; then
                cat /tmp/typecheck-errors.txt
              else
                tail -60 /tmp/typecheck.log || true
              fi
              echo '```'
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CONTRACT_BOT_APP_ID }}
          private-key: ${{ secrets.CONTRACT_BOT_PRIVATE_KEY }}

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          commit-message: 'chore(openapi): sync contract from ${{ steps.fetch.outputs.tag }}'
          branch: bot/openapi-sync
          delete-branch: true
          title: 'chore(openapi): sync contract from ${{ steps.fetch.outputs.tag }}'
          body: |
            🤖 自动同步后端 OpenAPI 契约

            **契约来源**
            - Release Tag: `${{ steps.fetch.outputs.tag }}`
            - SHA256: `${{ steps.fetch.outputs.sha256 }}`
            - Asset URL: ${{ steps.fetch.outputs.asset_url }}

            **变更内容**
            - 更新 `openapi/drone-backend.openapi.json`
            - 更新 `openapi/drone-backend.openapi.sha256`
            - 重新生成 `src/api/generated/openapi.d.ts`

            **待适配清单（本 PR 内处理）**

            ${{ steps.worklist.outputs.worklist }}

            > 本 PR 由机器人开启，只保证契约与生成物同源；`pnpm run typecheck` 失败**不阻断**本 PR。
            > 适配完成后由人工合并，main 的 CI（`pnpm exec vue-tsc -b`）是最终门禁。

            ---
            _由 [contract-sync workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) 自动创建_

      - name: Add workflow summary
        run: |
          echo "## OpenAPI Contract Sync 结果" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Release Tag**: \`${{ steps.fetch.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SHA256**: \`${{ steps.fetch.outputs.sha256 }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          
          if [ "${{ steps.cpr.outputs.pull-request-operation }}" = "created" ]; then
            echo "✅ 已创建 PR: ${{ steps.cpr.outputs.pull-request-url }}" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.cpr.outputs.pull-request-operation }}" = "updated" ]; then
            echo "✅ 已更新 PR: ${{ steps.cpr.outputs.pull-request-url }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ℹ️ 无需更新（契约未变化）" >> "$GITHUB_STEP_SUMMARY"
          fi
          
          if [ -z "${{ steps.app-token.outputs.token }}" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ **注意**: 使用了 GITHUB_TOKEN，PR 不会自动触发 CI" >> "$GITHUB_STEP_SUMMARY"
            echo "   配置 \`CONTRACT_BOT_APP_ID\` 和 \`CONTRACT_BOT_PRIVATE_KEY\` secrets 以启用 GitHub App token" >> "$GITHUB_STEP_SUMMARY"
          fi
